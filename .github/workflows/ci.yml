name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      matrix:
        go: ['1.22', '1.23']
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./tests/ -v

  cpp:
    name: C++ (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      matrix:
        compiler: ['gcc', 'clang']
    defaults:
      run:
        working-directory: cpp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang build-essential

      - name: CMake configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}

      - name: CMake build
        run: cmake --build build -j$(nproc)

      - name: Run echo-server example
        run: ./build/echo-server &
          sleep 1
          curl -sf http://127.0.0.1:9000/health && echo "echo-server OK"
